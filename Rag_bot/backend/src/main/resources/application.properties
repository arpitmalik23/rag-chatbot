spring.application.name=rag-chatbot-backend
server.port=8080

# ---------- CORS ----------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# ---------- Gemini ----------
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
gemini.api-key=${GEMINI_API_KEY}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}
gemini.embedding-dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-3.5-flash}

# ---------- Groq (chat generation) ----------
groq.api-key=${GROQ_API_KEY}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.chat-model=${GROQ_CHAT_MODEL:llama-3.3-70b-versatile}

# ---------- Qdrant ----------
qdrant.url=${QDRANT_URL:http://localhost:6333}
qdrant.api-key=${QDRANT_API_KEY:}
qdrant.collection=${QDRANT_COLLECTION:doc_chunks}

# ---------- Upstash Redis ----------
# Format: rediss://default:<password>@<host>:<port>
upstash.redis.url=${UPSTASH_REDIS_URL}
redis.history.max-turns=${REDIS_HISTORY_MAX_TURNS:50}
redis.ttl.seconds=${REDIS_TTL_SECONDS:86400}

# ---------- RAG ----------
rag.top-k=${RAG_TOP_K:4}

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ---------- Logging ----------
logging.level.com.ragbot=INFO
logging.level.org.springframework.web.reactive.function.client=WARN
